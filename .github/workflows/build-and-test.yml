name: build and test cv2pdb

on: [push, pull_request]

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: src/cv2pdb.vcxproj

  # Configuration type to build.
  BUILD_CONFIGURATION: Release
  BUILD_PLATFORM_TOOLSET: v143

jobs:
  build:
    runs-on: windows-2022
    strategy:
      matrix:
        BUILD_PLATFORM: [x64, ARM64]
    steps:
      - uses: actions/checkout@v4
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
      - name: Build cv2pdb
        working-directory: ${{env.GITHUB_WORKSPACE}}
        run: msbuild /m /p:PlatformToolset=${{env.BUILD_PLATFORM_TOOLSET}} /p:Platform=${{matrix.BUILD_PLATFORM}} /p:Configuration=${{env.BUILD_CONFIGURATION}} ${{env.SOLUTION_FILE_PATH}}
      - name: Build dumplines
        working-directory: ${{env.GITHUB_WORKSPACE}}
        run: msbuild /m /p:PlatformToolset=${{env.BUILD_PLATFORM_TOOLSET}} /p:Platform=Win32 /p:Configuration=${{env.BUILD_CONFIGURATION}} src/dumplines.vcxproj
      - name: Upload bin/
        if: matrix.BUILD_PLATFORM == 'x64'
        uses: actions/upload-artifact@v4
        with:
          name: bin
          path: bin
  test-with-g4w-sdk:
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: test
      - name: Download bin/
        uses: actions/download-artifact@v4
        with:
          name: bin
          path: bin
      - uses: git-for-windows/setup-git-for-windows-sdk@v1
      - name: verify using Git for Windows' GCC
        shell: bash
        run: |
          set -x &&
          cat >hello.c <<-\EOF &&
          #include <stdio.h>

          int main(int argc, char **argv)
          {
            printf("Hello, world\n");
            return 0;
          }
          EOF

          gcc -g -o hello.exe hello.c &&
          bin/${{env.BUILD_CONFIGURATION}}*/cv2pdb.exe hello.exe world.exe &&

          ls -l hello* world* &&

          curl -Lo cvdump.exe https://raw.githubusercontent.com/microsoft/microsoft-pdb/HEAD/cvdump/cvdump.exe &&
          ./cvdump.exe world.pdb >world.cvdump &&
          grep '^S_PUB32: .*, Flags: 00000000, main$' world.cvdump
      - name: verify split functions
        shell: bash
        run: |
          set -x &&
          cat >split.c <<-\EOF &&
          __attribute__((cold,noinline)) void cold() { volatile int i=0; }
          __attribute__((dllexport)) void split_func(int i)
          {
            if (i)
              cold();
          }
          EOF

          gcc -g -O2 -shared -o split-dwarf.dll split.c &&
          bin/${{env.BUILD_CONFIGURATION}}*/cv2pdb.exe split-dwarf.dll split-cv.dll &&

          ls -l split-dwarf* split-cv* &&

          curl -Lo cvdump.exe https://raw.githubusercontent.com/microsoft/microsoft-pdb/HEAD/cvdump/cvdump.exe &&
          ./cvdump.exe split-cv.pdb > split-cv.dump &&
          awk '$2 == "S_GPROC32:" && $NF == "split_func" { scope=gensub(/,/,"",1,$3); } $2 == "S_SEPCODE:" { getline; if ($4 == scope) found=1; } END {exit !found; }' split-cv.dump
      - name: verify CFA-relative locals
        shell: bash
        run: |
          set -x &&
          cat >frame.c <<-\EOF &&
          volatile int g_sink;

          __attribute__((noinline)) int opaque(int *p) { g_sink = *p; return *p + 1; }

          __attribute__((noinline)) int framed(int a)
          {
            int local = a * 3;
            int arr[8];
            for (int i = 0; i < 8; i++)
              arr[i] = opaque(&local) + i;
            return arr[a & 7] + local;
          }

          int main(int argc, char **argv)
          {
            return framed(argc);
          }
          EOF

          curl -Lo cvdump.exe https://raw.githubusercontent.com/microsoft/microsoft-pdb/HEAD/cvdump/cvdump.exe &&
          for v in 4 5; do
            gcc -g -gdwarf-$v -O2 -dA -S -o frame-d$v.s frame.c &&
            { grep -q DW_OP_call_frame_cfa frame-d$v.s || { echo "test precondition lost: frame base is not the CFA"; exit 1; }; } &&
            awk '/^framed:/ { f = 1 }
                 f && /\.cfi_def_cfa_offset/ { last = $2; if ($2 > max) max = $2 }
                 f && /\.cfi_(restore|remember_state)/ { restore = 1 }
                 f && /\.cfi_endproc/ { ok = last == 8 && max > 8 && !restore; exit }
                 END { exit !ok }' frame-d$v.s ||
              { echo "test precondition lost: the frame description of framed() has a remember or restore instruction, allocates no stack frame, or does not end with the frame released"; exit 1; }
            gcc -g -gdwarf-$v -O2 -o frame-d$v.exe frame.c &&
            { objdump -h frame-d$v.exe | grep ' \.debug_frame ' || { echo "test precondition lost: frame-d$v.exe has no .debug_frame section"; exit 1; }; } &&
            objdump -d --no-show-raw-insn --disassemble=framed frame-d$v.exe >frame-d$v.asm &&
            bin/${{env.BUILD_CONFIGURATION}}*/cv2pdb.exe frame-d$v.exe frame-cv-d$v.exe &&
            ./cvdump.exe -s frame-cv-d$v.pdb >frame-cv-d$v.dump &&
            awk 'FNR == NR { if (match($0, /0x[0-9a-f]+\(%rsp\),%rcx$/)) { slot = strtonum(substr($0, RSTART, RLENGTH - 11)); n++ } next }
                 $2 == "S_GPROC32:" { inp = $NF == "framed"; d = 0 }
                 inp && $2 == "S_BLOCK32:" { d++ }
                 $2 == "S_END" { if (d) d--; else inp = 0 }
                 inp && $2 == "S_REGREL32:" && $NF == "local" { print; split($3, r, /[+,]/); ok = r[1] == "rsp" && strtonum("0x" r[2]) == slot }
                 END { printf "expected rsp+%x\n", slot; exit !(n == 1 && ok) }' frame-d$v.asm frame-cv-d$v.dump || exit 1
          done
      - name: build and convert program with location lists (gcc)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -x &&
          cat >stacked.c <<-\EOF &&
          __attribute__((noinline)) int stacked(int a, int b, int c, int d, int e)
          {
            volatile int buf[16];
            for (int i = 0; i < 16; i++)
              buf[i] = a * i + b;
            e += buf[c & 15] * d;
            return buf[d & 15] + e * c;
          }

          int main(int argc, char **argv)
          {
            return stacked(argc, argc + 1, argc + 2, argc + 3, argc + 4);
          }
          EOF

          curl -Lo cvdump.exe https://raw.githubusercontent.com/microsoft/microsoft-pdb/HEAD/cvdump/cvdump.exe &&
          for v in 4 5; do
            gcc -g -gdwarf-$v -O2 -dA -S -o stacked-d$v.s stacked.c &&
            { awk -v v=$v '$1 == ".section" { loc = $2 ~ /^\.debug_loc(lists)?,/ }
                           loc && /# Location list begin address/ { lists = 1 }
                           loc && /# DW_LLE_base_address / { base = 1 }
                           END { exit !(lists && (v == 4 || base)) }' stacked-d$v.s ||
              { echo "test precondition lost: stacked-d$v.s has no location lists, or (DWARF 5) none that starts with DW_LLE_base_address"; exit 1; }; } &&
            gcc -g -gdwarf-$v -O2 -c -o stacked-d$v.o stacked.c &&
            gcc -o stacked-d$v.exe stacked-d$v.o &&
            llvm-objdump -d --debug-vars=ascii --no-show-raw-insn --disassemble-symbols=stacked stacked-d$v.o >stacked-d$v.vars &&
            bin/${{env.BUILD_CONFIGURATION}}*/cv2pdb.exe stacked-d$v.exe stacked-cv-d$v.exe &&
            ./cvdump.exe -s stacked-cv-d$v.pdb >stacked-cv-d$v.dump || exit 1
          done
      - name: verify stack parameters across frame allocation (gcc)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -x &&
          for v in 4 5; do
            frame=$(awk '/^[0-9a-f]+ <stacked>:$/ { f = 1; next }
                         !f { next }
                         /[\/|]- e = .*fbreg/ { slot = 1 }
                         /^ *[0-9a-f]+:/ { if (slot && match($0, /subq\t\$0x([0-9a-f]+), %rsp/, m)) print strtonum("0x" m[1]); exit }' stacked-d$v.vars) &&
            { test -n "$frame" || { echo "test precondition lost: e is not in its stack slot at the entry of stacked, or stacked does not start by allocating its frame"; exit 1; }; } &&
            awk -v frame=$frame '$2 == "S_GPROC32:" { inp = $NF == "stacked"; split($3, a, /[:\]]/); if (inp) lo = strtonum("0x" a[2]); var = ""; next }
                 !inp { next }
                 $2 == "S_LOCAL:" { var = $NF; if (var == "e") print; next }
                 var == "e" && $2 ~ /^S_DEFRANGE_/ { print; slot = $2 == "S_DEFRANGE_REGISTER_REL:" && $3 == "[rsp" && NF == 6 ? strtonum("0x" $5) : -1; next }
                 var == "e" && $1 == "Range:" { print; split($2, s, /[:\]]/); split($4, x, /[:\]]/); rs = strtonum("0x" s[2]); at[rs] = slot; end[rs] = strtonum("0x" x[2]) }
                 $2 ~ /^S_/ && $2 !~ /^S_DEFRANGE_/ { var = "" }
                 END { printf "expected rsp+%x, then rsp+%x\n", 40, 40 + frame; exit !(at[lo] == 40 && at[end[lo]] == 40 + frame) }' stacked-cv-d$v.dump || exit 1
          done
      - name: verify S_LOCAL records against the DWARF (gcc)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -x &&
          for v in 4 5; do
            awk -v want='stacked:a stacked:b stacked:c stacked:d stacked:e' -f test/check-locals.awk stacked-d$v.vars stacked-d$v.vars stacked-cv-d$v.dump || exit 1
          done
  test-dwarf5:
    runs-on: windows-latest
    needs: build
    steps:
      - name: Download bin/
        uses: actions/download-artifact@v4
        with:
          name: bin
          path: bin
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: false
      - name: download cvdump
        shell: bash
        run: curl -Lo cvdump.exe https://raw.githubusercontent.com/microsoft/microsoft-pdb/HEAD/cvdump/cvdump.exe
      - name: build and convert DWARF 5 Go program
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -x &&
          cat >main.go <<-\EOF &&
          package main

          import "os"

          //go:noinline
          func Square(x int) int { return x * x }

          func Twice(x int) int { return x + x }

          type Value int

          //go:noinline
          func (v Value) Get() int { return int(v) + 1 }

          type Getter interface{ Get() int }

          var sink func(int) int

          //go:noinline
          func call(g Getter) int { return g.Get() }

          func main() {
            sink = Twice
            os.Exit(Square(len(os.Args)) + Twice(len(os.Args)) + sink(1) + call(new(Value)) - 100)
          }
          EOF

          go version &&
          CGO_ENABLED=0 go build -ldflags=-compressdwarf=false -o go-dwarf.exe main.go &&
          go tool nm go-dwarf.exe >go-dwarf.nm &&
          bin/${{env.BUILD_CONFIGURATION}}*/cv2pdb.exe go-dwarf.exe go-cv.exe &&
          ./cvdump.exe -s -l go-cv.pdb >go-cv.dump
      - name: verify function addresses (Go)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -x &&
          text=$(awk '$3 == "runtime.text" { print $1 }' go-dwarf.nm) &&
          for f in main.call main.main 'main.(*Value).Get'; do
            addr=$(awk -v n="$f" '$2 == "T" && $3 == n { print $1 }' go-dwarf.nm) &&
            off=$(printf '%08X' $((0x$addr - 0x$text))) &&
            awk -v a="[0001:$off]," -v n=", ${f//./@}" '$2 == "S_GPROC32:" && $3 == a && substr($0, length($0) - length(n) + 1) == n { found=1 } END {exit !found; }' go-cv.dump || exit 1
          done
      - name: verify names of inlined functions (Go)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -x &&
          grep 'S_GPROC32: .*, main@Twice$' go-cv.dump &&
          ! grep 'S_GPROC32: .*\[anon_' go-cv.dump
      - name: verify source file of generated code (Go)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -x &&
          grep -m1 '^  \.\\<autogenerated> (' go-cv.dump &&
          ! grep '^  \.\\? (' go-cv.dump
      - name: verify variables with an empty location are left out (Go)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -x &&
          mkdir -p emptyloc &&
          cat >emptyloc/main.go <<-\EOF &&
          package main

          import (
            "debug/dwarf"
            "debug/pe"
            "fmt"
            "os"
            "strings"
          )

          func main() {
            f, err := pe.Open(os.Args[1])
            if err != nil {
              panic(err)
            }
            d, err := f.DWARF()
            if err != nil {
              panic(err)
            }
            r := d.Reader()
            fn := ""
            for {
              e, err := r.Next()
              if err != nil {
                panic(err)
              }
              if e == nil {
                break
              }
              name, _ := e.Val(dwarf.AttrName).(string)
              switch e.Tag {
              case dwarf.TagSubprogram:
                fn = name
              case dwarf.TagFormalParameter, dwarf.TagVariable:
                loc := e.AttrField(dwarf.AttrLocation)
                if strings.HasPrefix(fn, "main.") && loc != nil && loc.Class == dwarf.ClassExprLoc && len(loc.Val.([]byte)) == 0 {
                  fmt.Println(strings.ReplaceAll(fn, ".", "@"), name)
                }
              }
            }
          }
          EOF

          go run emptyloc/main.go go-dwarf.exe >emptyloc.txt &&
          { test -s emptyloc.txt || { echo "test precondition lost: no variable with an empty location"; exit 1; }; } &&
          awk 'NR == FNR { want[$1 " " $2] = 1; next }
               $2 == "S_GPROC32:" { proc = $NF }
               $2 == "S_REGREL32:" && (proc " " $NF) in want { print; bad++ }
               END { exit bad > 0 }' emptyloc.txt go-cv.dump
      - name: build DWARF 5 clang program
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -x &&
          cat >block.c <<-\EOF &&
          #include <stdio.h>
          #include <stdlib.h>

          __attribute__((noinline)) int get(int i) { return rand() + i; }

          int main(int argc, char **argv)
          {
            int sum = 0;
            for (int i = 0; i < argc; i++) {
              int v = get(i);
              if (v & 1) {
                int w = get(v);
                sum += w * v;
              } else
                sum -= v;
            }
            printf("%d\n", sum);
            return 0;
          }
          EOF

          clang --target=x86_64-w64-mingw32 -fuse-ld=lld -g -gdwarf-5 -O2 -o block.exe block.c &&
          clang --target=x86_64-w64-mingw32 -fuse-ld=lld -g -gdwarf-5 -O2 -ffunction-sections -o sections.exe block.c &&
          clang --target=x86_64-w64-mingw32 -g -gdwarf-5 -O2 -c -o block.o block.c &&
          llvm-objdump -h block.o >block-o.sections &&
          { grep ' \.debug_rnglists ' block-o.sections || { echo "test precondition lost: no lexical block with ranges"; exit 1; }; } &&
          llvm-objdump -h block.exe >block.sections &&
          llvm-nm block.exe >block.nm
      - name: convert line tables with MD5 checksums (clang)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -x &&
          bin/${{env.BUILD_CONFIGURATION}}*/cv2pdb.exe block.exe block-cv.exe 2>&1 | tee block-cv.log &&
          bin/${{env.BUILD_CONFIGURATION}}*/cv2pdb.exe sections.exe sections-cv.exe 2>&1 | tee sections-cv.log &&
          ./cvdump.exe -s -l block-cv.pdb >block-cv.dump
      - name: verify conversion reports no errors (clang)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -x &&
          test -f block-cv.log && test -f sections-cv.log &&
          ! grep ERROR: block-cv.log sections-cv.log
      - name: verify function addresses (clang)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -x &&
          text=$(awk '$2 == ".text" { print $4 }' block.sections) &&
          for f in get main; do
            addr=$(awk -v n=$f '$2 == "T" && $3 == n { print $1 }' block.nm) &&
            off=$(printf '%08X' $((0x$addr - 0x$text))) &&
            grep "S_GPROC32: \[0001:$off\], .*, $f\$" block-cv.dump || exit 1
          done
      - name: verify lexical block addresses (clang)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -x &&
          awk '$2 == "S_GPROC32:" { split($3, a, /[:\]]/); lo = strtonum("0x" a[2]); hi = lo + strtonum("0x" substr($5, 1, 8)); inmain = $NF == "main"; }
               $2 == "S_BLOCK32:" && inmain { split($3, a, /[:\]]/); o = strtonum("0x" a[2]); n++; if (o < lo || o >= hi) { print; bad++; } }
               END {exit !(n && !bad); }' block-cv.dump
      - name: build and convert DWARF 5 clang program with globals
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -x &&
          cat >global.c <<-\EOF &&
          int g_counter = 1;
          static int s_counter = 2;

          int main(int argc, char **argv)
          {
            s_counter += argc;
            return g_counter + s_counter;
          }
          EOF

          clang --target=x86_64-w64-mingw32 -fuse-ld=lld -g -gdwarf-5 -O0 -Wl,--image-base=0x10000000 -o global.exe global.c &&
          clang --target=x86_64-w64-mingw32 -g -gdwarf-5 -O0 -S -o global.s global.c &&
          { awk '/# DW_AT_location$/ { getline; if ($2 == 161) n++ } END { exit !n }' global.s || { echo "test precondition lost: no DW_OP_addrx location"; exit 1; }; } &&
          llvm-objdump -p global.exe >global.headers &&
          { grep -E '^ImageBase\s+0*10000000$' global.headers || { echo "test precondition lost: image base is not 0x10000000"; exit 1; }; } &&
          llvm-objdump -h global.exe >global.sections &&
          llvm-nm global.exe >global.nm &&
          bin/${{env.BUILD_CONFIGURATION}}*/cv2pdb.exe global.exe global-cv.exe &&
          ./cvdump.exe -g global-cv.pdb >global-cv.dump
      - name: verify global variable addresses (clang)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -x &&
          seg=$(awk '$2 == ".data" { printf "%04X", $1 + 1 }' global.sections) &&
          data=$(awk '$2 == ".data" { print $4 }' global.sections) &&
          for v in g_counter s_counter; do
            addr=$(awk -v n=$v '$3 == n { print $1 }' global.nm) &&
            off=$(printf '%08X' $((0x$addr - 0x$data))) &&
            grep "S_GDATA32: \[$seg:$off\], .*, $v\$" global-cv.dump || exit 1
          done
      - name: verify variables of out-of-line instances of inlined functions (clang)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -x &&
          cat >inline.c <<-\EOF &&
          volatile int g_sink;

          __attribute__((noinline)) void opaque(int *p) { g_sink = *p; }

          static int helper(int a)
          {
            int local = a * 3;
            opaque(&local);
            opaque(&a);
            return local + a;
          }

          int (*volatile fp)(int) = helper;

          int main(int argc, char **argv)
          {
            return helper(argc) + fp(argc);
          }
          EOF

          for v in 4 5; do
            clang --target=x86_64-w64-mingw32 -g -gdwarf-$v -O2 -S -o inline-d$v.s inline.c &&
            awk '/^\t\.section/ { abbrev = $2 ~ /^\.debug_abbrev/ }
                 !abbrev { next }
                 /# Abbreviation Code$/ { tag = ""; delete at }
                 /# DW_TAG_/ && !tag { tag = $NF }
                 /# DW_AT_/ { at[$NF] = 1 }
                 /# EOM\(1\)$/ {
                   if (tag == "DW_TAG_subprogram" && ("DW_AT_abstract_origin" in at) && ("DW_AT_low_pc" in at)) sub_ok = 1
                   if (tag == "DW_TAG_inlined_subroutine" && ("DW_AT_abstract_origin" in at)) inl_ok = 1
                   if (("DW_AT_abstract_origin" in at) && ("DW_AT_location" in at) && !("DW_AT_name" in at)) {
                     if (tag == "DW_TAG_formal_parameter") par_ok = 1
                     if (tag == "DW_TAG_variable") var_ok = 1
                   }
                 }
                 END { exit !(sub_ok && inl_ok && par_ok && var_ok) }' inline-d$v.s ||
              { echo "test precondition lost: no inlined and out-of-line instances of a function with unnamed variables"; exit 1; }
            clang --target=x86_64-w64-mingw32 -fuse-ld=lld -g -gdwarf-$v -O2 -o inline-d$v.exe inline.c &&
            llvm-objdump -d --no-show-raw-insn --disassemble-symbols=helper inline-d$v.exe >inline-d$v.asm &&
            bin/${{env.BUILD_CONFIGURATION}}*/cv2pdb.exe inline-d$v.exe inline-cv-d$v.exe &&
            ./cvdump.exe -s inline-cv-d$v.pdb >inline-cv-d$v.dump &&
            awk 'FNR == NR { if (match($0, /0x[0-9a-f]+\(%rsp\), %rcx$/)) slots[strtonum(substr($0, RSTART, RLENGTH - 12))] = 1; next }
                 $2 == "S_GPROC32:" { fn = $NF; d = 0 }
                 fn != "" && $2 == "S_BLOCK32:" { d++ }
                 $2 == "S_END" { if (d) d--; else fn = "" }
                 fn == "helper" && $2 == "S_REGREL32:" { print; split($3, r, /[+,]/); if (r[1] == "rsp" && (strtonum("0x" r[2]) in slots)) found[$NF] = 1 }
                 fn == "main" && $2 == "S_REGREL32:" && ($NF == "a" || $NF == "local") { print; leaked = 1 }
                 END { exit !(("a" in found) && ("local" in found) && !leaked) }' inline-d$v.asm inline-cv-d$v.dump || exit 1
          done
  test-64-bit-addresses:
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: test
      - name: Download bin/
        uses: actions/download-artifact@v4
        with:
          name: bin
          path: bin
      - name: download cvdump
        shell: bash
        run: curl -Lo cvdump.exe https://raw.githubusercontent.com/microsoft/microsoft-pdb/HEAD/cvdump/cvdump.exe
      - name: build and convert DWARF 4 clang program
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -x &&
          cat >block.c <<-\EOF &&
          #include <stdio.h>
          #include <stdlib.h>

          int g_counter = 3;
          static int s_total;

          __attribute__((noinline)) int get(int i) { return rand() + i; }
          __attribute__((noinline)) void use(int *p) { *p += g_counter; }

          int main(int argc, char **argv)
          {
            for (int i = 0; i < argc; i++) {
              int v = get(i);
              use(&v);
              if (v & 1) {
                int w = get(v);
                use(&w);
                s_total += w * v;
              } else
                s_total -= v;
            }
            printf("%d\n", s_total);
            return 0;
          }
          EOF

          clang --target=x86_64-w64-mingw32 -fuse-ld=lld -g -gdwarf-4 -O2 -ffunction-sections -o block.exe block.c &&
          clang --target=x86_64-w64-mingw32 -g -gdwarf-4 -O2 -ffunction-sections -S -o block.s block.c &&
          { awk '/DW_TAG_lexical_block$/ { getline; if ($NF == "DW_AT_ranges") r = $2 ":" } r && $1 == r { getline; if ($1 == ".quad" && $2 !~ /-/) found = 1 } END { exit !found }' block.s || { echo "test precondition lost: no lexical block with absolute ranges"; exit 1; }; } &&
          llvm-objdump -p block.exe >block.headers &&
          { awk '$1 == "ImageBase" { found = strtonum("0x" $2) >= 2^32 } END { exit !found }' block.headers || { echo "test precondition lost: image base below 4 GB"; exit 1; }; } &&
          llvm-objdump -h block.exe >block.sections &&
          llvm-nm block.exe >block.nm &&
          bin/${{env.BUILD_CONFIGURATION}}*/cv2pdb.exe block.exe block-cv.exe &&
          ./cvdump.exe -s block-cv.pdb >block-cv.dump &&
          ./cvdump.exe -g block-cv.pdb >block-cv.globals
      - name: verify global variable addresses (clang)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -x &&
          for v in g_counter s_total; do
            addr=$(awk -v n=$v '$3 == n { print $1 }' block.nm) &&
            test -n "$addr" &&
            loc=$(awk -v a=$((0x$addr)) '$1 ~ /^[0-9]+$/ { lo = strtonum("0x" $4); if (lo <= a && a < lo + strtonum("0x" $3)) printf "[%04X:%08X],", $1 + 1, a - lo }' block.sections) &&
            awk -v a="$loc" -v n=", $v" '($1 == "S_GDATA32:" || $1 == "S_LDATA32:") && $2 == a && substr($0, length($0) - length(n) + 1) == n { found=1 } END {exit !found; }' block-cv.globals || exit 1
          done
      - name: verify locals of lexical blocks with ranges (clang)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -x &&
          awk '$2 == "S_GPROC32:" { inmain = $NF == "main"; depth = 0 }
               inmain && $2 == "S_BLOCK32:" { depth++ }
               inmain && $2 == "S_END" { depth-- }
               inmain && depth > 0 && $2 == "S_REGREL32:" { found[$NF] = 1 }
               END {exit !(found["v"] && found["w"]); }' block-cv.dump
      - name: verify parameters described by DWARF 4 location lists (clang)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -x &&
          cat >spill.c <<-\EOF &&
          #include <stdio.h>
          #include <stdlib.h>

          #define CLOBBER __asm__ volatile("" ::: "rax", "rbx", "rcx", "rdx", "rsi", "rdi", "r8", "r9", "r10", "r11", "r12", "r13", "r14", "r15", "memory")

          __attribute__((noinline)) int get(int i) { return rand() + i; }

          __attribute__((noinline)) int spill(int a, int b)
          {
            int s = get(a);
            CLOBBER;
            s += get(b);
            CLOBBER;
            s += get(s);
            CLOBBER;
            return s * a + b;
          }

          int main(int argc, char **argv)
          {
            printf("%d\n", spill(argc, argc + 1));
            return 0;
          }
          EOF

          clang --target=x86_64-w64-mingw32 -fuse-ld=lld -g -gdwarf-4 -O2 -ffunction-sections -o spill.exe spill.c &&
          clang --target=x86_64-w64-mingw32 -g -gdwarf-4 -O2 -ffunction-sections -S -o spill.s spill.c &&
          { awk 'FNR == NR && $1 ~ /^\.Linfo_string[0-9]+:$/ { s = substr($1, 1, length($1) - 1); getline; str[s] = $2; next }
                 FNR == NR && $1 == ".section" { inloc = $2 ~ /^\.debug_loc,/; next }
                 FNR == NR && inloc && $1 ~ /^\.Ldebug_loc[0-9]+:$/ { l = substr($1, 1, length($1) - 1); getline; base[l] = $1 == ".quad" && $2 == "-1"; next }
                 FNR == NR && inloc && $NF == "DW_OP_breg7" { getline; slots[l] = slots[l] " " $NF; next }
                 FNR == NR && inloc && $NF ~ /^DW_OP_reg[0-9]+$/ { regs[l] = 1; next }
                 FNR == NR { next }
                 /Abbrev \[/ { tag = $NF; if (tag == "DW_TAG_subprogram") insub = 0 }
                 tag == "DW_TAG_subprogram" && $NF == "DW_AT_name" { insub = str[$2] == "\"spill\"" }
                 insub && tag == "DW_TAG_formal_parameter" && $NF == "DW_AT_location" { l = $2 }
                 insub && tag == "DW_TAG_formal_parameter" && $NF == "DW_AT_name" { if (!base[l] || slots[l] == "" || !regs[l]) bad = 1; name = str[$2]; gsub(/"/, "", name); print name slots[l]; n++; l = "" }
                 END { exit bad || n != 2 }' spill.s spill.s >spill.expected ||
            { echo "test precondition lost: spill should have two parameters, each with a location list that starts with a base address entry and includes a register and a stack slot"; exit 1; }; } &&
          cat spill.expected &&
          bin/${{env.BUILD_CONFIGURATION}}*/cv2pdb.exe spill.exe spill-cv.exe &&
          ./cvdump.exe -s spill-cv.pdb >spill-cv.dump &&
          awk 'FNR == NR { want[$1] = $0 " "; next }
               $2 == "S_GPROC32:" { inspill = $NF == "spill"; d = 0; var = ""; split($3, a, /[:\]]/); lo = strtonum("0x" a[2]); hi = lo + strtonum("0x" substr($5, 1, 8)); next }
               !inspill { next }
               $2 == "S_BLOCK32:" { d++ }
               $2 == "S_END" { if (d) d--; else inspill = 0 }
               $2 == "S_REGREL32:" && ($NF in want) { print; bad = 1 }
               $2 == "S_LOCAL:" { var = $NF; if (var in want) { got[var]++; if ($3 != "Param:") { print; bad = 1 } } next }
               $2 == "S_DEFRANGE_REGISTER_REL:" && (var in want) && $3 == "[rsp" && index(want[var], " " strtonum("0x" $5) " ") { slot[var] = 1 }
               $2 == "S_DEFRANGE_REGISTER:" && (var in want) && $3 ~ /^(e(ax|bx|cx|dx|si|di|bp)|r([89]|1[0-5])d)$/ { reg[var] = 1 }
               $1 == "Range:" { split($2, s, /[:\]]/); split($4, e, /[:\]]/); rs = strtonum("0x" s[2]); re = strtonum("0x" e[2])
                                if (rs < lo || re > hi || re <= rs || re - rs > 61440) { print; bad = 1 }
                                for (i = 9; i < NF; i += 2) { gs = $i; gl = $(i + 1); gsub(/[(),]/, "", gs); gsub(/[(),]/, "", gl); if (strtonum("0x" gs) + strtonum("0x" gl) > re - rs) { print; bad = 1 } } }
               $2 ~ /^S_/ && $2 !~ /^S_DEFRANGE_/ { var = "" }
               END { for (p in want) if (got[p] != 1 || !slot[p] || !reg[p]) { print "expected one S_LOCAL Param with a stack slot and a 32-bit register for " p; bad = 1 }; exit bad }' spill.expected spill-cv.dump
      - name: verify procedures at the 4 GB boundary (clang)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -x &&
          cat >edge.c <<-\EOF &&
          __attribute__((noinline)) int edge(int a) { return a * 7 + 1; }

          int main(int argc, char **argv) { return edge(argc); }
          EOF

          clang --target=x86_64-w64-mingw32 -fuse-ld=lld -g -O1 -o edge-probe.exe edge.c &&
          base=$(llvm-objdump -p edge-probe.exe | awk '$1 == "ImageBase" { print $2 }') &&
          main=$(llvm-nm edge-probe.exe | awk '$3 == "main" { print $1 }') &&
          clang --target=x86_64-w64-mingw32 -fuse-ld=lld -g -O1 -Wl,--image-base=$(printf '0x%x' $(((1 << 32) - (0x$main - 0x$base)))) -o edge.exe edge.c &&
          llvm-objdump -h edge.exe >edge.sections &&
          llvm-nm edge.exe >edge.nm &&
          { awk '$3 == "main" { found = strtonum("0x" $1) == 2^32 } END { exit !found }' edge.nm || { echo "test precondition lost: main does not start at 4 GB"; exit 1; }; } &&
          bin/${{env.BUILD_CONFIGURATION}}*/cv2pdb.exe edge.exe edge-cv.exe &&
          ./cvdump.exe -s edge-cv.pdb >edge-cv.dump &&
          text=$(awk '$2 == ".text" { print $4 }' edge.sections) &&
          addr=$(awk '$2 == "T" && $3 == "main" { print $1 }' edge.nm) &&
          off=$(printf '%08X' $((0x$addr - 0x$text))) &&
          grep "S_GPROC32: \[0001:$off\], .*, main\$" edge-cv.dump
      - name: build and convert programs with location lists (clang)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -x &&
          cat >locals.c <<-\EOF &&
          #include <stdio.h>
          #include <stdlib.h>

          struct pair { long long lo, hi; };

          __attribute__((noinline)) int get(int i) { return rand() + i; }

          __attribute__((noinline)) long long byval(struct pair p, int n)
          {
            long long s = get(n);
            s += get((int)s);
            return s + p.lo * p.hi;
          }

          #define R1(i) acc = acc * 31 + get(acc ^ (i));
          #define R4(i) R1(i) R1(i + 1) R1(i + 2) R1(i + 3)
          #define R16(i) R4(i) R4(i + 4) R4(i + 8) R4(i + 12)
          #define R64(i) R16(i) R16(i + 16) R16(i + 32) R16(i + 48)
          #define R256(i) R64(i) R64(i + 64) R64(i + 128) R64(i + 192)
          #define R1K(i) R256(i) R256(i + 256) R256(i + 512) R256(i + 768)

          __attribute__((noinline)) int big(int seed)
          {
            int acc = get(seed);
            R1K(0) R1K(1024) R1K(2048) R1K(3072)
            return acc * seed;
          }

          int main(int argc, char **argv)
          {
            struct pair p = { argc, argc + 1 };
            printf("%lld %d\n", byval(p, argc), big(argc));
            return 0;
          }
          EOF

          for v in 2 4 5; do
            clang --target=x86_64-w64-mingw32 -g -gdwarf-$v -O2 -ffunction-sections -S -o locals-d$v.s locals.c &&
            { awk -v v=$v '/# DW_AT_location$/ { getline; form[$NF] = 1 }
                           /^\.Ldebug_loc[0-9]+:$/ { getline; if ($1 == ".quad" && $2 == "-1") base = 1 }
                           /# DW_LLE_base_addressx$/ { basex = 1 }
                           END { exit !(v == 2 ? form["DW_FORM_data4"] && base : v == 4 ? form["DW_FORM_sec_offset"] && base : basex) }' locals-d$v.s ||
              { echo "test precondition lost: no DWARF $v location list starts with a base address entry, or the location attributes do not use data4 (DWARF 2) or sec_offset (DWARF 4)"; exit 1; }; } &&
            clang --target=x86_64-w64-mingw32 -g -gdwarf-$v -O2 -ffunction-sections -c -o locals-d$v.o locals.c &&
            clang --target=x86_64-w64-mingw32 -fuse-ld=lld -o locals-d$v.exe locals-d$v.o &&
            { llvm-objdump -p locals-d$v.exe | awk '$1 == "ImageBase" { found = strtonum("0x" $2) >= 2^32 } END { exit !found }' || { echo "test precondition lost: image base below 4 GB"; exit 1; }; } &&
            llvm-objdump -d --debug-vars=ascii --no-show-raw-insn --disassemble-symbols=byval,big locals-d$v.o >locals-d$v.vars &&
            bin/${{env.BUILD_CONFIGURATION}}*/cv2pdb.exe locals-d$v.exe locals-cv-d$v.exe &&
            ./cvdump.exe -s locals-cv-d$v.pdb >locals-cv-d$v.dump || exit 1
          done
      - name: verify by-value struct parameters are written without the parameter flag (clang)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -x &&
          for v in 2 4 5; do
            { grep -E '[/|]- p = \[RCX\]' locals-d$v.vars && grep -E '[/|]- p = \[RSI\]' locals-d$v.vars ||
              { echo "test precondition lost: the DWARF does not address the struct parameter of byval through RCX and then RSI"; exit 1; }; } &&
            awk '$2 == "S_GPROC32:" { inp = $NF == "byval"; var = ""; next }
                 !inp { next }
                 $2 == "S_LOCAL:" { var = $NF; if (var == "p") { print; n++; kind = $3 } next }
                 var == "p" && $2 == "S_DEFRANGE_REGISTER_REL:" && $5 == "0000" && NF == 6 { print; base[$3] = 1; next }
                 var == "p" && $2 ~ /^S_DEFRANGE_/ { print; bad = 1 }
                 $2 ~ /^S_/ && $2 !~ /^S_DEFRANGE_/ { var = "" }
                 END { exit !(n == 1 && kind == "Local:" && base["[rcx"] && base["[rsi"] && !bad) }' locals-cv-d$v.dump || exit 1
          done
      - name: verify locals of procedures larger than F000 (clang)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -x &&
          for v in 2 4 5; do
            { awk '/^[0-9a-f]+ <big>:$/ { inbig = 1; next }
                   /^[0-9a-f]+ </ { inbig = 0 }
                   inbig && /^ *[0-9a-f]+:/ { last = strtonum("0x" substr($1, 1, length($1) - 1)) }
                   inbig && /[\/|]- seed = R(BX|SI|DI|BP|1[2-5]) *$/ { saved = 1 }
                   END { exit !(last > 61440 && saved) }' locals-d$v.vars ||
              { echo "test precondition lost: big is not longer than F000, or seed is not kept in a callee-saved register"; exit 1; }; } &&
            awk '$2 == "S_GPROC32:" { inp = $NF == "big"; var = ""; next }
                 !inp { next }
                 $2 == "S_LOCAL:" { var = $NF; next }
                 var == "seed" && $2 ~ /^S_DEFRANGE_/ { reg = $2 == "S_DEFRANGE_REGISTER:" ? $3 : ""; next }
                 var == "seed" && $1 == "Range:" { split($2, s, /[:\]]/); split($4, e, /[:\]]/); rs = strtonum("0x" s[2]); re = strtonum("0x" e[2])
                                                   if (re - rs > 61440) { print; bad = 1 }
                                                   if (reg != "" && reg == prev && rs == end) { print reg; print; chained++ }
                                                   prev = reg; end = re }
                 $2 ~ /^S_/ && $2 !~ /^S_DEFRANGE_/ { var = "" }
                 END { exit !(chained && !bad) }' locals-cv-d$v.dump || exit 1
          done
      - name: verify S_LOCAL records against the DWARF (clang)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -x &&
          for v in 2 4 5; do
            awk -v want='byval:p byval:n byval:s big:seed big:acc' -f test/check-locals.awk locals-d$v.vars locals-d$v.vars locals-cv-d$v.dump || exit 1
          done
  test-arm64:
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: test
      - name: Download bin/
        uses: actions/download-artifact@v4
        with:
          name: bin
          path: bin
      - name: download cvdump
        shell: bash
        run: curl -Lo cvdump.exe https://raw.githubusercontent.com/microsoft/microsoft-pdb/HEAD/cvdump/cvdump.exe
      - name: build ARM64 clang program
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -x &&
          cat >arm64.c <<-\EOF &&
          __attribute__((noinline)) int get(volatile int *p) { return *p; }

          __attribute__((noinline)) int frame(int a, int b)
          {
            volatile int local = a * b;
            int arr[4] = { a, b, a, b };
            return get(&local) + arr[a & 3];
          }

          __attribute__((noinline)) int dynamic(int n)
          {
            int buf[n];
            volatile int marker = n * 7;
            for (int i = 0; i < n; i++)
              buf[i] = i + marker;
            return get(&marker) + buf[n - 1];
          }

          int start(void) { return frame(1, 2) + dynamic(3); }
          EOF

          for o in O0 O2; do
            clang --target=aarch64-w64-mingw32 -fuse-ld=lld -g -$o -nostdlib -mno-stack-arg-probe -Wl,-e,start -o arm64-$o.exe arm64.c &&
            clang --target=aarch64-w64-mingw32 -g -$o -mno-stack-arg-probe -S -o arm64-$o.s arm64.c &&
            { llvm-objdump -f arm64-$o.exe | grep 'file format coff-arm64' || { echo "test precondition lost: arm64-$o.exe is not an ARM64 image"; exit 1; }; } &&
            { awk '/DW_AT_frame_base/ { getline; if ($2 == "109") fp++; if ($2 == "111") sp++; } END { exit !(fp && sp); }' arm64-$o.s ||
              { echo "test precondition lost: arm64-$o.s does not have both a frame base in FP (DW_OP_reg29) and one in SP (DW_OP_reg31)"; exit 1; }; } || exit 1
          done
      - name: convert ARM64 clang program
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -x &&
          for o in O0 O2; do
            bin/${{env.BUILD_CONFIGURATION}}*/cv2pdb.exe arm64-$o.exe arm64-$o-cv.exe 2>&1 | tee arm64-$o-cv.log &&
            ./cvdump.exe -s arm64-$o-cv.pdb >arm64-$o-cv.dump || exit 1
          done
      - name: verify target processor (ARM64)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -x &&
          grep '^ *Target processor: ARM64$' arm64-O0-cv.dump &&
          grep '^ *Target processor: ARM64$' arm64-O2-cv.dump
      - name: verify registers of locals (ARM64)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -x &&
          for o in O0 O2; do
            awk '$2 == "S_REGREL32:" { split($3, r, "+"); n[r[1]]++; if (r[1] != "sp" && r[1] != "fp") { print; bad++; } }
                 END { exit !(n["sp"] && n["fp"] && !bad); }' arm64-$o-cv.dump || exit 1
          done
      - name: build and convert ARM64 program with location lists (clang)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -x &&
          cat >locals.c <<-\EOF &&
          #define CLOBBER __asm__ volatile("" ::: "x0", "x1", "x2", "x3", "x4", "x5", "x6", "x7", "x8", "x9", "x10", "x11", "x12", "x13", "x14", "x15", "x16", "x17", "x19", "x20", "x21", "x22", "x23", "x24", "x25", "x26", "x27", "x28", "memory")

          volatile int g_seed;

          __attribute__((noinline)) int get(int i) { return g_seed + i; }

          __attribute__((noinline)) int spill(int a, int b)
          {
            int s = get(a);
            CLOBBER;
            s += get(b);
            s += get(s);
            return s * a + b;
          }

          int start(void) { return spill(1, 2); }
          EOF

          clang --target=aarch64-w64-mingw32 -g -O2 -c -o locals.o locals.c &&
          clang --target=aarch64-w64-mingw32 -fuse-ld=lld -nostdlib -Wl,-e,start -o locals.exe locals.o &&
          llvm-objdump -d --debug-vars=ascii --no-show-raw-insn --disassemble-symbols=spill locals.o >locals.vars &&
          { awk 'match($0, /[\/|]- ([ab]) = (.*)/, m) { n[m[1]]++; if (m[2] ~ /^W[0-9]+ *$/) w[m[1]] = 1 }
                 END { exit !(n["a"] > 1 && n["b"] > 1 && w["a"] && w["b"]) }' locals.vars ||
            { echo "test precondition lost: the parameters of spill do not have location lists that include a W register"; exit 1; }; } &&
          bin/${{env.BUILD_CONFIGURATION}}*/cv2pdb.exe locals.exe locals-cv.exe &&
          ./cvdump.exe -s locals-cv.pdb >locals-cv.dump
      - name: verify registers of S_DEFRANGE records (ARM64)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -x &&
          awk 'function arm(r) { return r ~ /^([wx]([0-9]|[12][0-9]|30)|sp|fp|lr)$/ }
               $2 == "S_GPROC32:" { inp = $NF == "spill"; var = ""; next }
               $2 == "S_LOCAL:" { var = $NF; if (inp && (var == "a" || var == "b")) { print; if ($3 == "Param:") param[var] = 1 } next }
               $2 == "S_DEFRANGE_REGISTER:" { if (!arm($3)) { print; bad = 1 } if (inp && $3 ~ /^w/) w[var] = 1 }
               $2 == "S_DEFRANGE_REGISTER_REL:" && !arm(substr($3, 2)) { print; bad = 1 }
               $2 == "S_DEFRANGE_SUBFIELD_REGISTER:" && !arm($6) { print; bad = 1 }
               $2 ~ /^S_/ && $2 !~ /^S_DEFRANGE_/ { var = "" }
               END { exit !(param["a"] && param["b"] && w["a"] && w["b"] && !bad) }' locals-cv.dump
      - name: verify S_LOCAL records against the DWARF (ARM64)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -x &&
          awk -v want='spill:a spill:b spill:s' -f test/check-locals.awk locals.vars locals.vars locals-cv.dump
